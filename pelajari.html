
<!-- NATURE FACT QUEST MODAL -->
<div id="natureFactModal" class="nature-fact-modal">
  <div class="nature-fact-card">

    <button
      type="button"
      class="nature-fact-close"
      id="closeNatureFact"
    >
      &times;
    </button>

    <div class="nature-fact-icon">🌿</div>

    <h2>Fakta Alam Hari Ini!</h2>

    <p>
      Wah, kamu belajar sesuatu yang baru tentang alam!
      Yuk, ceritakan sedikit ilmu yang kamu dapat hari ini.
    </p>

    <label for="natureFactInput">
      Apa yang kamu pelajari?
    </label>

    <textarea
      id="natureFactInput"
      placeholder="Contoh: Pohon dapat menyerap karbon dioksida dari udara..."
      rows="4"
    ></textarea>

    <p id="natureFactError" class="nature-fact-error"></p>

    <button
      type="button"
      id="submitNatureFact"
      class="nature-fact-submit"
    >
      Selesaikan Quest 🌱
    </button>

  </div>
</div>
